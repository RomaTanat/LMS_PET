{% extends "base.html" %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 3rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1.5rem;">✅</div>
        <h2 class="section-title" style="margin-bottom: 1.5rem;">Пароль успешно изменен</h2>
        <p class="text-muted" style="margin-bottom: 2rem;">
            Ваш пароль был успешно обновлен. Теперь вы можете войти в систему с новым паролем.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Войти</a>
    </div>
</div>
{% endblock %}
