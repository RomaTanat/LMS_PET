{% extends "base.html" %}

{% block title %}Пароль изменен - LMS Platform{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2.5rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1.5rem;">✅</div>
        <h2 class="section-title" style="margin-bottom: 1.5rem;">Пароль успешно изменен!</h2>

        <p class="text-muted" style="margin-bottom: 2rem;">
            Ваш пароль был успешно обновлен. Теперь вы можете войти в систему с новым паролем.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary" style="padding: 0.75rem 2rem;">Войти в аккаунт</a>
    </div>
</div>
{% endblock %}
