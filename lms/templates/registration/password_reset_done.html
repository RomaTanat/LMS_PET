{% extends "base.html" %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 3rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1.5rem;">📧</div>
        <h2 class="section-title" style="margin-bottom: 1.5rem;">Проверьте почту</h2>
        <p class="text-muted" style="margin-bottom: 2rem; line-height: 1.6;">
            Мы отправили вам письмо с инструкциями по сбросу пароля.
            Если вы не получили письмо в течение нескольких минут, проверьте папку "Спам".
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
