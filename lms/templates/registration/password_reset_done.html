{% extends "base.html" %}

{% block title %}Письмо отправлено | LMS{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="width: 100%; max-width: 400px; padding: 2.5rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📧</div>
        <h2 class="mb-4">Письмо отправлено</h2>
        <p class="text-muted mb-4">
            Мы отправили инструкцию по сбросу пароля на указанный вами адрес электронной почты.
            Если вы не получили письмо, проверьте папку "Спам".
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
