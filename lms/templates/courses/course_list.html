{% extends 'base.html' %}

{% block content %}
<div class="container" style="padding: 2rem;">
    <h1 class="section-title text-center">Список курсов</h1>

    <!-- Форма поиска -->
    <form method="GET" action="{% url 'course_list' %}"
        style="display: flex; justify-content: center; margin-bottom: 2rem; gap: 0.5rem;">
        <input type="text" name="q" placeholder="Поиск курсов..." value="{{ request.GET.q }}"
            style="padding: 0.75rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; width: 100%; max-width: 400px; outline: none;">
        <button type="submit" class="btn btn-primary">
            🔍 Искать
        </button>
    </form>

    {% if courses %}
    <div class="achievements-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
        {% for course in courses %}
        <div class="glass-panel"
            style="padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%;">
            <div style="height: 180px; overflow: hidden; position: relative;">
                <img src="{{ course.image.url }}" alt="Курс" style="width: 100%; height: 100%; object-fit: cover;"
                    onerror="this.onerror=null; this.src='https://source.unsplash.com/400x250/?education,learning';">
                <div
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.5));">
                </div>
            </div>

            <div style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: white;">{{ course.title }}
                </h2>
                <p class="text-muted" style="margin-bottom: 1.5rem; flex: 1; line-height: 1.6;">{{
                    course.description|truncatechars:100 }}</p>

                <a href="{% url 'course_detail' course.pk %}" class="btn btn-primary" style="text-align: center; width: 100%; box-sizing: border-box; display: block;">
                    Подробнее →
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="glass-panel text-center" style="padding: 3rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">🔍</div>
        <p class="text-muted">Курсы не найдены.</p>
        <a href="{% url 'course_list' %}" class="btn btn-outline" style="margin-top: 1rem; display: inline-block;">Сбросить поиск</a>
    </div>
    {% endif %}
</div>
{% endblock %}
