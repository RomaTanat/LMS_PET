{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2.5rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
        <h2 class="section-title" style="justify-content: center; margin-bottom: 1.5rem;">Пароль изменен!</h2>
        <p class="text-muted" style="margin-bottom: 2rem;">
            Ваш пароль был успешно изменен. Теперь вы можете войти в систему, используя новый пароль.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Войти</a>
    </div>
</div>
{% endblock %}
