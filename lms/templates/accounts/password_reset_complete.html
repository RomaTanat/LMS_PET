{% extends "base.html" %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel text-center" style="width: 100%; max-width: 500px; padding: 3rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem; color: var(--success);">✅</div>
        <h2 class="section-title" style="justify-content: center; margin-bottom: 1.5rem;">Успешно!</h2>
        <p class="text-muted" style="margin-bottom: 2rem;">
            Ваш пароль был успешно изменен. Теперь вы можете войти с новым паролем.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">
            Войти
        </a>
    </div>
</div>
{% endblock %}
