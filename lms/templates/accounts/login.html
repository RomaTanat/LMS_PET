{% extends 'base.html' %}
{% block title %}Вход - LMS Platform{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding-top: 40px;">
    <div class="glass-panel" style="width: 100%; max-width: 400px;">
        <h2 class="section-title" style="text-align: center; margin-bottom: 2rem;">Вход в систему</h2>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color: #ef4444; font-size: 0.875rem; margin-top: 0.25rem;">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                Войти
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                Нет аккаунта? <a href="{% url 'register' %}" style="color: var(--primary);">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
