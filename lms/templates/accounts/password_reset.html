{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <h2 class="section-title text-center" style="margin-bottom: 2rem;">Сброс пароля</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center;">Введите ваш email, и мы отправим вам инструкцию по сбросу пароля.</p>
        <form method="post" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}
            {% for field in form %}
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="color: var(--text-muted); font-size: 0.9rem;">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-full" style="margin-top: 1rem;">Сбросить пароль</button>
        </form>
    </div>
</div>

<style>
    input[type="email"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: all 0.3s ease;
    }
    input[type="email"]:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.1);
    }
</style>
{% endblock %}
