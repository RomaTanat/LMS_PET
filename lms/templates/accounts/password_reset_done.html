        <div style="font-size: 3rem; margin-bottom: 1rem;">📧</div>
        <h2 class="section-title" style="justify-content: center; margin-bottom: 1.5rem;">Проверьте почту</h2>

        <a href="{% url 'home' %}" class="btn btn-outline">

    </div>
</div>
