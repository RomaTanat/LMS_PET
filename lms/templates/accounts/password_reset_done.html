{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2.5rem; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📧</div>
        <h2 class="section-title" style="justify-content: center; margin-bottom: 1.5rem;">Проверьте почту</h2>
        <p class="text-muted" style="margin-bottom: 2rem; line-height: 1.6;">
            Мы отправили вам инструкции по установке нового пароля на указанный email адрес. Вы должны получить их в ближайшее время.
        </p>
        <p class="text-muted" style="font-size: 0.9rem;">
            Если вы не получили письмо, пожалуйста, проверьте папку "Спам".
        </p>
        <div style="margin-top: 2rem;">
            <a href="{% url 'login' %}" class="btn btn-outline">Вернуться ко входу</a>
        </div>
    </div>
</div>
{% endblock %}
