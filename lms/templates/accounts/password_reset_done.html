{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2.5rem; text-align: center;">
        <h2 class="section-title" style="margin-bottom: 2rem;">Проверьте почту</h2>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">Мы отправили вам инструкцию по установке нового пароля на указанный email.</p>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Если письмо не пришло в течение нескольких минут, проверьте папку "Спам".</p>
        <a href="{% url 'login' %}" class="btn btn-primary">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
