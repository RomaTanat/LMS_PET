{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 2.5rem; text-align: center;">
        <h2 class="section-title" style="margin-bottom: 2rem;">Письмо отправлено</h2>
        <p class="text-muted" style="margin-bottom: 1.5rem;">
            Мы отправили вам инструкции по установке нового пароля на указанный email.
            Если вы не получили письмо, пожалуйста, проверьте папку спам.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
