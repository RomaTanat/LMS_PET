{% extends 'base.html' %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="padding: 3rem; text-align: center; max-width: 600px; width: 100%;">
        <h1 style="font-size: 4rem; margin-bottom: 1rem; color: #fff;">404</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; color: rgba(255,255,255,0.9);">Страница не найдена</h2>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 2rem;">
            К сожалению, страница, которую вы ищете, не существует или была перемещена.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary" style="display: inline-block; padding: 0.75rem 1.5rem; text-decoration: none;">На главную</a>
    </div>
</div>
{% endblock %}
