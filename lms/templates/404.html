{% extends 'base.html' %}

{% block title %}404 - Страница не найдена{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 flex justify-center">
    <div class="glass-panel max-w-lg w-full text-center p-8">
        <h1 class="text-6xl font-bold text-white mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-gray-200 mb-6">Страница не найдена</h2>
        <p class="text-gray-300 mb-8">
            К сожалению, запрашиваемая вами страница не существует или была перемещена.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary inline-block">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
