{% extends 'base.html' %}

{% block title %}404 - Страница не найдена{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="text-align: center; padding: 3rem; max-width: 500px;">
        <h1 style="font-size: 4rem; margin-bottom: 1rem; color: var(--primary);">404</h1>
        <h2 style="margin-bottom: 1rem;">Страница не найдена</h2>
        <p style="margin-bottom: 2rem; color: var(--text-muted);">
            К сожалению, страница, которую вы ищете, не существует или была перемещена.
        </p>
        <a href="/" class="btn btn-primary">Вернуться на главную</a>
    </div>
</div>
{% endblock %}
