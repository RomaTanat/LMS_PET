{% extends "base.html" %}

{% block title %}Страница не найдена | LMS{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 3rem; text-align: center;">
        <h1 style="font-size: 5rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        <h2 class="mb-4">Страница не найдена</h2>
        <p class="text-muted mb-4">
            Похоже, мы не можем найти страницу, которую вы ищете. Возможно, она была удалена или перемещена.
        </p>
        <a href="/" class="btn btn-primary">На главную</a>
    </div>
</div>
{% endblock %}
