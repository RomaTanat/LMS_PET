{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel text-center" style="max-width: 600px; padding: 3rem;">
        <h1 style="font-size: 6rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem;">404</h1>
        <h2 class="section-title" style="justify-content: center; margin-bottom: 1.5rem;">Страница не найдена</h2>
        <p class="text-muted" style="margin-bottom: 2rem; font-size: 1.1rem;">
            К сожалению, страница, которую вы ищете, не существует или была перемещена.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
