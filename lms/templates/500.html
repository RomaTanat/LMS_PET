{% extends 'base.html' %}

{% block title %}500 - Ошибка сервера{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="glass-panel" style="text-align: center; max-width: 600px; padding: 3rem;">
        <h1 style="font-size: 6rem; font-weight: 800; background: linear-gradient(to right, #fca5a5, #ef4444); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">500</h1>
        <h2 style="font-size: 2rem; margin-bottom: 1.5rem; color: white;">Внутренняя ошибка сервера</h2>
        <p class="text-muted" style="margin-bottom: 2rem; font-size: 1.1rem;">
            Что-то пошло не так на нашей стороне. Мы уже работаем над исправлением.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
