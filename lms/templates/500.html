{% extends 'base.html' %}

{% block title %}Ошибка сервера (500){% endblock %}

        <div style="font-size: 4rem; margin-bottom: 1rem;">🔧</div>
        <h1 style="color: var(--warning); margin-bottom: 1rem;">Ошибка сервера</h1>

        </p>
        <a href="{% url 'home' %}" class="btn btn-primary">На главную</a>
    </div>
</div>
{% endblock %}
