{% extends "base.html" %}

{% block title %}Ошибка сервера | LMS{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 3rem; text-align: center;">
        <h1 style="font-size: 5rem; background: linear-gradient(to right, var(--danger), var(--warning)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">500</h1>
        <h2 class="mb-4">Ошибка сервера</h2>
        <p class="text-muted mb-4">
            Что-то пошло не так на нашем сервере. Мы уже работаем над исправлением.
        </p>
        <a href="/" class="btn btn-primary">На главную</a>
    </div>
</div>
{% endblock %}
