{% extends 'base.html' %}

{% block title %}500 - Ошибка сервера{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-panel" style="text-align: center; max-width: 600px; padding: 3rem;">
        <div style="font-size: 5rem; margin-bottom: 1rem;">⚠️</div>
        <h1 class="section-title">Ошибка сервера</h1>
        <p class="text-muted" style="margin-bottom: 2rem; font-size: 1.1rem;">
            Произошла внутренняя ошибка сервера. Мы уже работаем над её устранением.
            Пожалуйста, попробуйте позже.
        </p>
        <a href="/" class="btn btn-primary" style="padding: 0.75rem 2rem;">
            Вернуться на главную
        </a>
    </div>
</div>
{% endblock %}
