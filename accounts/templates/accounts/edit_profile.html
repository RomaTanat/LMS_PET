{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; padding: 2rem;">
    <div class="glass-panel" style="width: 100%; max-width: 600px; padding: 2.5rem;">
        <h1 class="section-title text-center" style="margin-bottom: 2rem;">Редактирование профиля</h1>

        <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.5rem;">
            {% csrf_token %}

            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="color: var(--text-muted); font-size: 0.9rem;">Имя пользователя</label>
                {{ user_form.username }}
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="color: var(--text-muted); font-size: 0.9rem;">Email</label>
                {{ user_form.email }}
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="color: var(--text-muted); font-size: 0.9rem;">Аватар</label>
                {{ profile_form.avatar }}
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="color: var(--text-muted); font-size: 0.9rem;">Приоритеты</label>
                {{ profile_form.priorities }}
            </div>

            <button type="submit" class="btn btn-primary w-full" style="margin-top: 1rem;">
                Сохранить изменения
            </button>
        </form>
    </div>
</div>

<style>
    /* Custom styles for form inputs to match theme */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    textarea,
    input[type="file"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus,
    textarea:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.1);
    }
</style>
{% endblock %}
